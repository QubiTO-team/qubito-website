<!doctype html>
<!--
  The content editor of the site (Sveltia CMS). How to use it: docs/editing-content.md.
  This is a plain page, not built by Astro, with its own security rules (Content Security Policy):
  the editor needs a few things the rest of the site forbids, such as inline styles, previews of
  uploaded photos and WebAssembly to convert them to WebP. The editor itself is built from its npm
  package into ./cms/ by scripts/cms/build.mjs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' blob: data: https://api.github.com https://*.githubusercontent.com; worker-src 'self' blob:; media-src 'self' blob:; frame-src blob:; manifest-src blob:; object-src 'none'; base-uri 'self'"
    />
    <title>QubiTO · CMS</title>
    <script type="module" src="./cms/cms.js"></script>
  </head>
  <body></body>
</html>
