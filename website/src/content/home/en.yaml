tagline: Italy's first student team in quantum computing.

whoWeAre:
  title: About us
  body:
    - >-
      Founded in 2023 by students and professors at Politecnico di Torino, QubiTO is Italy's
      first quantum computing student team. We explore the theoretical and practical frontiers
      of quantum technologies, with a particular focus on quantum computing.
    - >-
      We have moved beyond pure theory. With the inauguration of Politecnico's first quantum
      computer from IQM, “Lagrange”, our team is actively testing algorithms and protocols
      directly on physical hardware.
  image:
    src: ../../assets/home/team-dinner.jpg
    alt: QubiTO members having dinner together around a long table of pizzas.
  links:
    - { label: Meet the team, url: /en/team/ }

