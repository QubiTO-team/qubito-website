qubits:
  title: Where the qubits live
  body:
    - >-
      At the bottom of the cryostat, at about 20 millikelvin, a temperature over a hundred
      times lower than that of deep space, sits the processor: a chip with superconducting
      circuits. Lagrange, PoliTo's quantum computer, has 5 qubits arranged in a star: one in
      the middle, coupled to the other four.
  links:
    - { label: How a superconducting qubit works, url: /en/articles/superconducting-qubits/ }
  credit: >-
    Lagrange is an [IQM Spark](https://iqm.tech/products/iqm-spark/). Chip design adapted from
    Fig. 1 of J. Rönkkö et al., [“On-premises superconducting quantum computer for education and
    research”](https://doi.org/10.1140/epjqt/s40507-024-00243-z), EPJ Quantum Technology 11, 32
    (2024), licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Changes:
    redrawn in 3D and simplified.
