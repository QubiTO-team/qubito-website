qubits:
  title: Dove vivono i qubit
  body:
    - >-
      In fondo al criostato, a circa 20 millikelvin, una temperatura oltre cento volte più
      bassa di quella dello spazio profondo, si trova il processore: un chip con circuiti
      superconduttori. Lagrange, il computer quantistico del PoliTo, ha 5 qubit disposti a
      stella: uno al centro, collegato agli altri quattro.
  links:
    - { label: Come funziona un qubit superconduttivo, url: /articles/superconducting-qubits/ }
  credit: >-
    Lagrange è un [IQM Spark](https://iqm.tech/products/iqm-spark/). Disegno del chip adattato
    dalla Fig. 1 di J. Rönkkö et al., [«On-premises superconducting quantum computer for
    education and research»](https://doi.org/10.1140/epjqt/s40507-024-00243-z), EPJ Quantum
    Technology 11, 32 (2024), licenza [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.it).
    Modifiche: ridisegnato in 3D e semplificato.
