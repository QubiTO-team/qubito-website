tagline: Il primo team studentesco di quantum computing in Italia.

whoWeAre:
  title: Chi siamo
  body:
    - >-
      Fondato nel 2023 da studenti e professori del Politecnico di Torino, QubiTO è il primo
      team studentesco di quantum computing in Italia. Esploriamo le frontiere teoriche e
      pratiche delle tecnologie quantistiche, con un focus particolare sulla computazione
      quantistica.
    - >-
      Siamo andati oltre la pura teoria. Con l'inaugurazione del primo computer quantistico
      del Politecnico firmato IQM, «Lagrange», il nostro team sta attivamente testando
      algoritmi e protocolli direttamente su hardware fisico.
  image:
    src: ../../assets/home/team-dinner.jpg
    alt: I membri di QubiTO a cena insieme attorno a un lungo tavolo con le pizze.
  links:
    - { label: Conosci il team, url: /team/ }

